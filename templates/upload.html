<!DOCTYPE html>
<html>
<head>

    <title>Create Story - StoryWorld</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <h1>📚 StoryWorld Admin</h1>

    <nav>
        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('admin_logout') }}">
            Logout
        </a>
    </nav>

</header>


<main>

<div class="form-container">

    <h2>Create New Story</h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <label>Story Title</label>

        <input
            type="text"
            name="title"
            placeholder="Enter story title"
            required
        >


        <label>Author</label>

        <input
            type="text"
            name="author"
            placeholder="Author name"
            required
        >


        <label>Category</label>

        <input
            type="text"
            name="category"
            placeholder="e.g. Romance, Action, Mystery"
            required
        >


        <label>Cover Image</label>

        <input
            type="file"
            name="cover"
            accept=".jpg,.jpeg,.png,.webp"
        >


        <button type="submit">
            Create Story
        </button>

    </form>

</div>

</main>

</body>
</html>
